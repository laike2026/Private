# Managed Jinpin Hui site
server {
    listen 80;
    server_name tiltrotator.com.cn www.tiltrotator.com.cn;
    location ^~ /.well-known/acme-challenge/ { root /srv/jinpinhui/acme; }
    location / { return 301 https://tiltrotator.com.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.tiltrotator.com.cn;
    ssl_certificate /etc/letsencrypt/live/jinpinhui-tiltrotator/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jinpinhui-tiltrotator/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://tiltrotator.com.cn$request_uri;
}
server {
    listen 443 ssl;
    server_name tiltrotator.com.cn;
    ssl_certificate /etc/letsencrypt/live/jinpinhui-tiltrotator/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jinpinhui-tiltrotator/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
